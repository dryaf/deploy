app_name: legacy-cgo
binary_name: server
build:
  cmd: >-
    podman run --rm -v "$(pwd):/app" -w /app docker.io/library/golang:1.24.5-alpine
    sh -c "go build -ldflags=\"-X main.Version={{.Version}}\" -o build/server ."
artifacts:
  include: [Dockerfile.vps, migrations]
environments:
  prod:
    host: example.com
    user: deploy_user
    target_dir: /home/deploy_user/web/legacy-cgo
    quadlet:
      service_name: legacy-cgo
      image: localhost/legacy-cgo:latest
      network: traefik-net.network
      router:
        domain: cgo.example.com
      env_file: ''
      auto_restart: true
