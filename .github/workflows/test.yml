name: Deployment checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Linux test prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq sqlite3 rsync
      - name: macOS test prerequisites
        if: runner.os == 'macOS'
        run: brew install sqlite rsync
      - run: make test
  live:
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runtime: [floor, current]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs
      - name: Enable namespaces in the disposable runner
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(id -un)"
      - name: Real SSH and rootless Podman
        shell: bash
        env:
          DEPLOY_TEST_RUNTIME: ${{ matrix.runtime }}
        run: |
          if [[ $DEPLOY_TEST_RUNTIME == current ]]; then export DEPLOY_TEST_BASE_IMAGE=current; fi
          make test-image-deploy-isolated 2>&1 | tee integration.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-${{ matrix.runtime }}
          path: integration.log
          retention-days: 7
  vm-crash:
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs qemu-system-x86 qemu-utils
      - name: Enable namespaces in the disposable runner
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(id -un)"
      - name: VM power interruption matrix
        shell: bash
        run: make test-deploy-vm-crash 2>&1 | tee vm-crash.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: vm-crash
          path: vm-crash.log
          retention-days: 7
  release-gate:
    needs: [fast, live, vm-crash]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check to succeed
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          LIVE_RESULT: ${{ needs.live.result }}
          VM_RESULT: ${{ needs.vm-crash.result }}
        run: |
          test "$FAST_RESULT" = success
          test "$LIVE_RESULT" = success
          test "$VM_RESULT" = success
          echo 'Fast, real SSH/Podman and VM recovery checks passed.'
